    <!-- Custom Styles -->
    <style>
        .glass-panel {
            background: rgba(18, 20, 20, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(68, 73, 51, 0.2);
        }

        .glow-hover:hover {
            box-shadow: 0 0 20px rgba(171, 214, 0, 0.2);
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(171, 214, 0, 0.3);
        }

        .card-glow:hover {
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25),
                0 0 25px rgba(171, 214, 0, 0.08);
        }

        .image-overlay {
            background:
                linear-gradient(to top,
                    rgba(18, 20, 20, 0.85),
                    rgba(18, 20, 20, 0.05));
        }

        .focus-ring:focus-visible {
            outline: 2px solid #abd600;
            outline-offset: 3px;
        }

        /* =========================
           TARJETAS DEL EQUIPO (Estilo Nosotros)
           ========================= */
        .team-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .team-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(18, 20, 20, 1) 0%,
                    rgba(18, 20, 20, 0.95) 24%,
                    rgba(18, 20, 20, 0.4) 50%,
                    rgba(18, 20, 20, 0) 75%);
            z-index: 10;
            pointer-events: none;
        }

        .team-image {
            filter: grayscale(100%) contrast(1.2);
            transition: all 0.5s ease;
        }

        .team-card:hover .team-image {
            filter: grayscale(0%) contrast(1);
            transform: scale(1.05);
        }

        .team-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -10px rgba(171, 214, 0, 0.15);
            border-color: rgba(171, 214, 0, 0.35);
        }

        .team-card .card-info {
            position: relative;
            z-index: 20;
            padding: 16px;
            margin-top: -65px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .text-justify {
            text-align: justify;
            text-justify: inter-word;

<body class="bg-background text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <div id="site-header" style="min-height: 81px;"></div>
    <script>
        fetch("header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("site-header").innerHTML = html;
                const activeLink = document.querySelector('[data-nav-item="blog"]');
                if (activeLink) {
                    activeLink.classList.remove("text-on-surface-variant", "border-transparent");
                    activeLink.classList.add("text-surface-tint", "border-surface-tint");
                }
            })
            .catch(err => console.error(err));
    </script>

    <!-- MAIN CONTENT -->
    <main class="flex-grow pt-4 px-margin-mobile md:px-margin-desktop max-w-5xl mx-auto w-full pb-section-gap">

        <!-- Navigation Breadcrumbs & Back Button -->
        <div class="flex items-center justify-between py-4 mb-6 border-b border-outline-variant/15">
            <a href="blog.html"
                class="inline-flex items-center gap-2 text-surface-tint hover:underline font-semibold text-sm transition-colors">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Volver a Publicaciones
            </a>

            <div class="flex items-center gap-2 text-xs text-on-surface-variant">
                <span>Blog</span>
                <span>/</span>
                <span id="breadcrumb-unit" class="text-primary font-semibold">UNIDAD 1</span>
            </div>
        </div>

        <!-- Article Container -->
        <article id="article-detail" class="space-y-8"></article>

    </main>

    <!-- Image Modal (For full screen sketch viewing) -->
    <div id="image-modal"
        class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4 backdrop-blur-sm cursor-pointer"
        onclick="closeModal()">
        <img id="modal-img" src="" alt="Vista ampliada"
            class="max-h-[90vh] max-w-[90vw] object-contain rounded-lg border border-outline-variant/30">
    </div>

    <!-- FOOTER -->
    <div id="site-footer" style="min-height: 220px;"></div>
    <script>
        fetch("footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("site-footer").innerHTML = html)
            .catch(err => console.error(err));

        function openModal(src) {
            const modal = document.getElementById("image-modal");
            const img = document.getElementById("modal-img");
            img.src = src;
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeModal() {
            const modal = document.getElementById("image-modal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        // Control del Prototipo Interactivo
        function switchPrototypeScreen(screenId) {
            const iframe = document.getElementById("prototype-iframe");
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ action: "NAVIGATE", screenId: screenId }, "*");
            }
            document.querySelectorAll(".proto-tab-btn").forEach(btn => {
                if (btn.dataset.screen === screenId) {
                    btn.classList.add("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                    btn.classList.remove("bg-surface-container", "text-on-surface-variant");
                } else {
                    btn.classList.remove("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                    btn.classList.add("bg-surface-container", "text-on-surface-variant");
                }
            });
        }

        // Cambiar entre la vista de Administrador y Cliente en el artículo
        function switchRoleView(role) {
            const btnAdmin = document.getElementById("tab-btn-admin");
            const btnCliente = document.getElementById("tab-btn-cliente");
            const quickAdmin = document.getElementById("quick-bar-admin");
            const quickCliente = document.getElementById("quick-bar-cliente");
            const cardsAdmin = document.getElementById("cards-container-admin");
            const cardsCliente = document.getElementById("cards-container-cliente");

            if (role === "admin") {
                if (btnAdmin) {
                    btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                }
                if (btnCliente) {
                    btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                }
                if (quickAdmin) quickAdmin.classList.remove("hidden");
                if (quickCliente) quickCliente.classList.add("hidden");
                if (cardsAdmin) cardsAdmin.classList.remove("hidden");
                if (cardsCliente) cardsCliente.classList.add("hidden");
                switchPrototypeScreen("screen-productos");
            } else {
                if (btnCliente) {
                    btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                }
                if (btnAdmin) {
                    btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                }
                if (quickAdmin) quickAdmin.classList.add("hidden");
                if (quickCliente) quickCliente.classList.remove("hidden");
                if (cardsAdmin) cardsAdmin.classList.add("hidden");
                if (cardsCliente) cardsCliente.classList.remove("hidden");
                switchPrototypeScreen("screen-cliente-catalogo");
            }
        }

        function resetPrototype() {
            const iframe = document.getElementById("prototype-iframe");
            if (iframe) {
                iframe.src = iframe.src;
                switchRoleView('admin');
            }
        }

        // Sincronizar botones cuando el usuario navega dentro del prototipo
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'SCREEN_CHANGED') {
                const screenId = e.data.screenId;

                // Actualizar pestaña de rol activa según la pantalla
                if (screenId.startsWith('screen-cliente')) {
                    const btnAdmin = document.getElementById("tab-btn-admin");
                    const btnCliente = document.getElementById("tab-btn-cliente");
                    const quickAdmin = document.getElementById("quick-bar-admin");
                    const quickCliente = document.getElementById("quick-bar-cliente");
                    const cardsAdmin = document.getElementById("cards-container-admin");
                    const cardsCliente = document.getElementById("cards-container-cliente");

                    if (btnCliente) btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                    if (btnAdmin) btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                    if (quickAdmin) quickAdmin.classList.add("hidden");
                    if (quickCliente) quickCliente.classList.remove("hidden");
                    if (cardsAdmin) cardsAdmin.classList.add("hidden");
                    if (cardsCliente) cardsCliente.classList.remove("hidden");
                } else {
                    const btnAdmin = document.getElementById("tab-btn-admin");
                    const btnCliente = document.getElementById("tab-btn-cliente");
                    const quickAdmin = document.getElementById("quick-bar-admin");
                    const quickCliente = document.getElementById("quick-bar-cliente");
                    const cardsAdmin = document.getElementById("cards-container-admin");
                    const cardsCliente = document.getElementById("cards-container-cliente");

                    if (btnAdmin) btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                    if (btnCliente) btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                    if (quickAdmin) quickAdmin.classList.remove("hidden");
                    if (quickCliente) quickCliente.classList.add("hidden");
                    if (cardsAdmin) cardsAdmin.classList.remove("hidden");
                    if (cardsCliente) cardsCliente.classList.add("hidden");
                }

                document.querySelectorAll(".proto-tab-btn").forEach(btn => {
                    if (btn.dataset.screen === screenId) {
                        btn.classList.add("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                        btn.classList.remove("bg-surface-container", "text-on-surface-variant");
                    } else {
                        btn.classList.remove("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                        btn.classList.add("bg-surface-container", "text-on-surface-variant");
                    }
                });
            }
        });
    </script>

    <!-- Cargar Datos Locales -->
    <script src="posts-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("slug") || "tarea-1-requerimientos-bocetos";

            const container = document.getElementById("article-detail");
            const pageTitle = document.getElementById("page-title");
            const breadcrumbUnit = document.getElementById("breadcrumb-unit");

            // Buscar en PUBLICACIONES_DATA
            const post = (typeof PUBLICACIONES_DATA !== 'undefined')
                ? PUBLICACIONES_DATA.find(p => p.slug === slug)
                : null;

            if (!post) {
                container.innerHTML = `
                    <div class="glass-panel p-12 rounded-2xl text-center border border-outline-variant/30">
                        <span class="material-symbols-outlined text-5xl text-surface-tint mb-4">article</span>
                        <h2 class="text-2xl font-bold text-primary mb-2">Publicación no encontrada</h2>
                        <p class="text-on-surface-variant text-sm mb-6">El artículo solicitado no existe.</p>
                        <a href="blog.html" class="inline-flex items-center gap-2 text-surface-tint hover:underline font-semibold">
                            <span class="material-symbols-outlined text-sm">arrow_back</span> Volver a Publicaciones
                        </a>
                    </div>
                `;
                return;
            }

            pageTitle.textContent = `${post.title} - TechNexus`;
            breadcrumbUnit.textContent = post.category || "UNIDAD 1";

            const sec = post.sections || {};
            let sectionsHtml = "";

            // 0. INTRODUCCIÓN / CONTEXTO DEL PROYECTO
            if (post.introduccion) {
                sectionsHtml += `
                    <section class="py-2">
                        <p class="text-body-md text-on-surface-variant leading-relaxed text-base md:text-lg font-normal text-justify">
                            ${post.introduccion}
                        </p>
                    </section>
                `;
            }

            // 1. REQUERIMIENTOS FUNCIONALES
            if (sec.requerimientos_funcionales && sec.requerimientos_funcionales.length > 0) {
                sectionsHtml += `
                    <section class="py-2">
                        <h2 class="font-headline-sm text-2xl text-primary font-semibold mb-2">
                            Requerimientos Funcionales
                        </h2>
                        ${sec.requerimientos_intro ? `<p class="text-sm text-on-surface-variant mb-4 text-justify">${sec.requerimientos_intro}</p>` : ''}
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${sec.requerimientos_funcionales.map(item => `
                                <div class="p-2 flex items-center gap-3">
                                    <span class="material-symbols-outlined text-surface-tint text-xl">check_circle</span>
                                    <span class="text-primary font-medium text-sm">${item}</span>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            // 2. REQUERIMIENTOS NO FUNCIONALES
            if (sec.requerimientos_no_funcionales && sec.requerimientos_no_funcionales.length > 0) {
                sectionsHtml += `
                    <section class="py-2">
                        <h2 class="font-headline-sm text-2xl text-primary font-semibold mb-3">
                            Requerimientos No Funcionales
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${sec.requerimientos_no_funcionales.map(item => `
                                <div class="p-2 flex items-center gap-3">
                                    <span class="material-symbols-outlined text-surface-tint text-xl">check_circle</span>
                                    <span class="text-primary font-medium text-sm">${item}</span>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            // 3. PLANIFICACIÓN Y ROLES DEL EQUIPO (Tarjetas visuales limpias sin justificaciones)
            if (sec.planificacion && sec.planificacion.length > 0) {
                sectionsHtml += `
                    <section class="py-4">
                        <h2 class="font-headline-sm text-2xl text-primary font-semibold mb-6">
                            Planificación y Roles del Equipo
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            ${sec.planificacion.map(persona => `
                                <div class="team-card bg-surface-container rounded-xl border border-surface-container-highest group">
                                    <div class="relative aspect-[3/4] overflow-hidden rounded-t-xl">
                                        <img
                                            alt="${persona.nombre}"
                                            class="w-full h-full object-cover team-image"
                                            src="${persona.foto}"
                                        >
                                    </div>
                                    <div class="card-info">
                                        <h3 class="font-headline-sm text-base text-primary font-bold mb-1 leading-snug">
                                            ${persona.nombre}
                                        </h3>
                                        <p class="font-label-caps text-xs text-surface-tint font-semibold">
                                            ${persona.rol}
                                        </p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            // 4. BOCETOS A MANO ALZADA
            if (sec.bocetos_mano && sec.bocetos_mano.length > 0) {
                sectionsHtml += `
                    <section class="py-2">
                        <h2 class="font-headline-sm text-2xl text-primary font-semibold mb-2">
                            Bocetos a Mano Alzada
                        </h2>
                        ${sec.bocetos_mano_intro ? `<p class="text-sm text-on-surface-variant mb-4 text-justify">${sec.bocetos_mano_intro}</p>` : ''}
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                            ${sec.bocetos_mano.map(b => `
                                <div class="group relative cursor-pointer overflow-hidden rounded-xl aspect-square" onclick="openModal('${b.imagen}')">
                                    <img src="${b.imagen}" alt="${b.titulo}" 
                                        class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-110">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/0 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-3">
                                        <p class="text-xs text-white font-medium">${b.titulo}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            // 5. BOCETOS DIGITALIZADOS (PROTOTIPO INTERACTIVO: ADMIN & CLIENTE)
            const adminBocetos = sec.bocetos_digitales_admin || sec.bocetos_digitales || [];
            const clienteBocetos = sec.bocetos_digitales_cliente || [];

            if (adminBocetos.length > 0 || clienteBocetos.length > 0) {
                sectionsHtml += `
                    <section class="glass-panel p-6 md:p-8 rounded-2xl glow-border">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                            <div>
                                <h2 class="font-headline-sm text-2xl text-primary font-semibold flex items-center gap-2">
                                    Bocetos Digitalizados
                                </h2>
                                <p class="text-xs md:text-sm text-on-surface-variant mt-1 text-justify">
                                    ${sec.bocetos_digitales_intro || 'Prototipo interactivo navegable de alta fidelidad para Administrador y Cliente.'}
                                </p>
                            </div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <a href="prototipo-tienda.html" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-xs font-semibold text-surface-tint border border-outline-variant/30 transition-colors">
                                    <span class="material-symbols-outlined text-sm">open_in_new</span>
                                    Pantalla Completa
                                </a>
                                <button onclick="resetPrototype()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-xs font-semibold text-on-surface-variant border border-outline-variant/30 transition-colors">
                                    <span class="material-symbols-outlined text-sm">replay</span>
                                    Reiniciar
                                </button>
                            </div>
                        </div>

                        <!-- Selector de Rol (Administrador / Cliente) -->
                        <div class="flex items-center justify-center mb-6">
                            <div class="inline-flex p-1 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 shadow-inner">
                                <button id="tab-btn-admin" onclick="switchRoleView('admin')" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm">
                                    <span class="material-symbols-outlined text-base">admin_panel_settings</span>
                                    Flujo Administrador (4 Vistas)
                                </button>
                                <button id="tab-btn-cliente" onclick="switchRoleView('cliente')" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary">
                                    <span class="material-symbols-outlined text-base">shopping_bag</span>
                                    Flujo Cliente / Comprador (4 Vistas)
                                </button>
                            </div>
                        </div>

                        <!-- Barra de Acceso Rápido a Pantallas del Administrador -->
                        <div id="quick-bar-admin" class="mb-6">
                            <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Vistas del Administrador:</p>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="switchPrototypeScreen('screen-productos')" data-screen="screen-productos" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-primary-container text-on-primary-fixed border border-surface-tint transition-all">
                                    <span class="material-symbols-outlined text-sm">inventory_2</span>
                                    1. Lista de Productos
                                </button>
                                <button onclick="switchPrototypeScreen('screen-agregar-producto')" data-screen="screen-agregar-producto" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-surface-container text-on-surface-variant hover:text-primary border border-outline-variant/20 transition-all">
                                    <span class="material-symbols-outlined text-sm">add_box</span>
                                    2. Añadir Producto
                                </button>
                                <button onclick="switchPrototypeScreen('screen-promociones')" data-screen="screen-promociones" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-surface-container text-on-surface-variant hover:text-primary border border-outline-variant/20 transition-all">
                                    <span class="material-symbols-outlined text-sm">local_offer</span>
                                    3. Lista de Promociones
                                </button>
                                <button onclick="switchPrototypeScreen('screen-agregar-promocion')" data-screen="screen-agregar-promocion" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-surface-container text-on-surface-variant hover:text-primary border border-outline-variant/20 transition-all">
                                    <span class="material-symbols-outlined text-sm">percent</span>
                                    4. Nueva Promoción
                                </button>
                            </div>
                        </div>

                        <!-- Barra de Acceso Rápido a Pantallas del Cliente -->
                        <div id="quick-bar-cliente" class="mb-6 hidden">
                            <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Vistas del Cliente (Comprador):</p>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="switchPrototypeScreen('screen-cliente-catalogo')" data-screen="screen-cliente-catalogo" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-surface-container text-on-surface-variant hover:text-primary border border-outline-variant/20 transition-all">
                                    <span class="material-symbols-outlined text-sm">storefront</span>
                                    1. Catálogo & Tienda
                                </button>
                                <button onclick="switchPrototypeScreen('screen-cliente-producto-detalle')" data-screen="screen-cliente-producto-detalle" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-surface-container text-on-surface-variant hover:text-primary border border-outline-variant/20 transition-all">
                                    <span class="material-symbols-outlined text-sm">info</span>
                                    2. Detalle del Producto
                                </button>
                                <button onclick="switchPrototypeScreen('screen-cliente-promociones')" data-screen="screen-cliente-promociones" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-surface-container text-on-surface-variant hover:text-primary border border-outline-variant/20 transition-all">
                                    <span class="material-symbols-outlined text-sm">sell</span>
                                    3. Promociones Vigentes
                                </button>
                                <button onclick="switchPrototypeScreen('screen-cliente-promo-detalle')" data-screen="screen-cliente-promo-detalle" class="proto-tab-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 bg-surface-container text-on-surface-variant hover:text-primary border border-outline-variant/20 transition-all">
                                    <span class="material-symbols-outlined text-sm">loyalty</span>
                                    4. Detalle de Oferta
                                </button>
                            </div>
                        </div>

                        <!-- Contenedor del Simulador Móvil Interactivo -->
                        <div class="flex flex-col items-center justify-center p-2 sm:p-4 bg-surface-container-lowest/60 rounded-2xl border border-outline-variant/20 mb-8">
                            <!-- Smartphone Mockup Wrapper -->
                            <div class="w-full max-w-[430px] rounded-[36px] bg-slate-900 p-3 shadow-2xl border-4 border-slate-700 relative ring-1 ring-white/10">
                                <!-- Smartphone Speaker / Notch -->
                                <div class="w-28 h-4 bg-black rounded-full mx-auto mb-2 flex items-center justify-center">
                                    <div class="w-3 h-3 rounded-full bg-slate-950/80 mr-2 border border-slate-800"></div>
                                    <div class="w-10 h-1 bg-slate-800 rounded-full"></div>
                                </div>
                                
                                <!-- Screen Frame (Iframe) -->
                                <div class="w-full h-[650px] rounded-[24px] overflow-hidden bg-white relative">
                                    <iframe id="prototype-iframe" src="prototipo-tienda.html" class="w-full h-full border-0" title="Prototipo Interactivo Tiendita de Barrio"></iframe>
                                </div>

                                <!-- Smartphone Bottom Home Bar -->
                                <div class="w-32 h-1 bg-slate-600 rounded-full mx-auto mt-3"></div>
                            </div>

                            <p class="text-xs text-center text-on-surface-variant mt-4 flex items-center justify-center gap-1.5">
                                <span class="material-symbols-outlined text-sm text-surface-tint">touch_app</span>
                                <strong>Prototipo 100% Navegable:</strong> Cambia entre pestañas, agrega productos/promociones o prueba la experiencia del cliente con selector de cantidad y carrito.
                            </p>
                        </div>

                        <!-- Desglose de Wireframes por Rol -->
                        <div id="cards-container-admin">
                            <h3 class="text-lg font-semibold text-primary mb-4 flex items-center gap-2">
                                Wireframes: Flujo del Administrador
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${adminBocetos.map((d, index) => `
                                    <div class="glass-panel p-4 rounded-xl border border-outline-variant/20 hover:border-surface-tint/40 transition-all group flex flex-col justify-between">
                                        <div>
                                            <div class="flex items-center justify-between mb-2">
                                                <span class="bg-surface-tint/10 text-surface-tint font-mono text-xs px-2 py-0.5 rounded font-semibold">
                                                    ADMIN 0${index + 1}
                                                </span>
                                                <button onclick="switchPrototypeScreen('${d.screen_id}')" class="text-xs text-surface-tint hover:underline flex items-center gap-1">
                                                    <span>Ver en prototipo</span>
                                                    <span class="material-symbols-outlined text-xs">arrow_forward</span>
                                                </button>
                                            </div>
                                            <h4 class="font-bold text-primary text-base mb-1">${d.titulo}</h4>
                                            <p class="text-xs text-on-surface-variant leading-relaxed text-justify">${d.descripcion || ''}</p>
                                        </div>
                                        <div class="mt-4 pt-3 border-t border-outline-variant/15 flex justify-end">
                                            <button onclick="switchPrototypeScreen('${d.screen_id}')" class="px-3 py-1.5 bg-surface-container hover:bg-surface-container-high text-primary rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors">
                                                <span class="material-symbols-outlined text-sm">play_arrow</span>
                                                Probar Pantalla
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div id="cards-container-cliente" class="hidden">
                            <h3 class="text-lg font-semibold text-primary mb-4 flex items-center gap-2">
                                Wireframes: Flujo del Cliente (Comprador)
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${clienteBocetos.map((d, index) => `
                                    <div class="glass-panel p-4 rounded-xl border border-outline-variant/20 hover:border-surface-tint/40 transition-all group flex flex-col justify-between">
                                        <div>
                                            <div class="flex items-center justify-between mb-2">
                                                <span class="bg-emerald-500/10 text-emerald-400 font-mono text-xs px-2 py-0.5 rounded font-semibold">
                                                    CLIENTE 0${index + 1}
                                                </span>
                                                <button onclick="switchPrototypeScreen('${d.screen_id}')" class="text-xs text-emerald-400 hover:underline flex items-center gap-1">
                                                    <span>Ver en prototipo</span>
                                                    <span class="material-symbols-outlined text-xs">arrow_forward</span>
                                                </button>
                                            </div>
                                            <h4 class="font-bold text-primary text-base mb-1">${d.titulo}</h4>
                                            <p class="text-xs text-on-surface-variant leading-relaxed text-justify">${d.descripcion || ''}</p>
                                        </div>
                                        <div class="mt-4 pt-3 border-t border-outline-variant/15 flex justify-end">
                                            <button onclick="switchPrototypeScreen('${d.screen_id}')" class="px-3 py-1.5 bg-surface-container hover:bg-surface-container-high text-primary rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors">
                                                <span class="material-symbols-outlined text-sm">play_arrow</span>
                                                Probar Pantalla
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </section>
                `;
            }

            // 6. CONCLUSIONES Y RESULTADOS
            if (sec.conclusiones) {
                const conclusionesContent = Array.isArray(sec.conclusiones)
                    ? sec.conclusiones.map(p => `<p class="text-body-md leading-relaxed text-on-surface-variant mb-3 text-justify">${p}</p>`).join('')
                    : `<p class="text-body-md leading-relaxed text-on-surface-variant text-justify">${sec.conclusiones}</p>`;

                sectionsHtml += `
                    <section class="py-2">
                        <h2 class="font-headline-sm text-2xl text-primary font-semibold mb-4">
                            Conclusiones y Resultados
                        </h2>
                        <div class="space-y-3">
                            ${conclusionesContent}
                        </div>
                    </section>
                `;
            }

            // Renderizar la página completa con la imagen arriba
            container.innerHTML = `
                <!-- Featured Image (Arriba) -->
                <div class="flex items-center justify-center p-2 mb-6">
                    <img src="${post.image_url}" alt="${post.title}"
                        class="w-full max-h-[480px] object-contain transition-all duration-300 ease-out hover:-translate-y-2 hover:shadow-2xl hover:scale-[1.02] cursor-pointer">
                </div>

                <!-- Article Header (Abajo de la imagen) -->
                <header class="space-y-4">
                    <div class="flex flex-wrap items-center gap-3">
                        <span class="bg-surface-container-high text-surface-tint font-label-caps text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold border border-surface-tint/30">
                            ${post.unit_tag || post.category}
                        </span>
                        <span class="text-xs text-on-surface-variant flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm">schedule</span>
                            ${post.duration || 'Tarea Formativa'}
                        </span>
                    </div>

                    <h1 class="font-display-lg text-3xl md:text-5xl text-primary font-bold leading-tight text-glow">
                        ${post.title}
                    </h1>

                    <p class="text-lg text-on-surface-variant leading-relaxed text-justify">
                        ${post.summary || ''}
                    </p>

                    <div class="flex items-center gap-4 pt-2 text-xs text-on-surface-variant border-t border-outline-variant/15">
                        <span>Autor: <strong class="text-primary">${post.author_name || 'Equipo TechNexus'}</strong></span>
                        <span>•</span>
                        <span>Fecha: <strong class="text-primary">${post.created_at || 'Agosto 2026'}</strong></span>
                    </div>
                </header>

                <!-- Sections -->
                <div class="space-y-10 pt-6">
                    ${sectionsHtml}
                </div>

                <!-- Footer Navigation inside Article -->
                <div class="pt-8 border-t border-outline-variant/20 flex justify-between items-center">
                    <a href="blog.html" class="inline-flex items-center gap-2 text-surface-tint hover:underline font-semibold text-sm">
                        <span class="material-symbols-outlined text-base">arrow_back</span>
                        Volver a Publicaciones
                    </a>
                </div>
            `;
        });
    </script>
</body>

</html>
