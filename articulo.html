<body class="bg-background text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <div id="site-header" style="min-height: 81px;"></div>
    <script>
        fetch("header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("site-header").innerHTML = html;
                const activeLink = document.querySelector('[data-nav-item="blog"]');
                if (activeLink) {
                    activeLink.classList.remove("text-on-surface-variant", "border-transparent");
                    activeLink.classList.add("text-surface-tint", "border-surface-tint");
                }
            })
            .catch(err => console.error(err));
    </script>

    <!-- MAIN CONTENT -->
    <main class="flex-grow pt-4 px-margin-mobile md:px-margin-desktop max-w-5xl mx-auto w-full pb-section-gap">

        <!-- Navigation Breadcrumbs & Back Button -->

                class="inline-flex items-center gap-2 text-surface-tint hover:underline font-semibold text-sm transition-colors">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Volver a Publicaciones
            </a>

            <div class="flex items-center gap-2 text-xs text-on-surface-variant">
                <span>Blog</span>
                <span>/</span>
                <span id="breadcrumb-unit" class="text-primary font-semibold">UNIDAD 1</span>
            </div>
        </div>

        <!-- Article Container -->
        <article id="article-detail" class="space-y-8"></article>

    </main>

    <!-- Image Modal (For full screen sketch viewing) -->
    <div id="image-modal"
        class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4 backdrop-blur-sm cursor-pointer"
        onclick="closeModal()">
        <img id="modal-img" src="" alt="Vista ampliada"
            class="max-h-[90vh] max-w-[90vw] object-contain rounded-lg border border-outline-variant/30">
    </div>

    <!-- FOOTER -->
    <div id="site-footer" style="min-height: 220px;"></div>
    <script>
        fetch("footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("site-footer").innerHTML = html)
            .catch(err => console.error(err));

        function openModal(src) {
            const modal = document.getElementById("image-modal");
            const img = document.getElementById("modal-img");
            img.src = src;
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeModal() {
            const modal = document.getElementById("image-modal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        // Control del Prototipo Interactivo
        function switchPrototypeScreen(screenId) {
            const iframe = document.getElementById("prototype-iframe");
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ action: "NAVIGATE", screenId: screenId }, "*");
            }
            document.querySelectorAll(".proto-tab-btn").forEach(btn => {
                if (btn.dataset.screen === screenId) {
                    btn.classList.add("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                    btn.classList.remove("bg-surface-container", "text-on-surface-variant");
                } else {
                    btn.classList.remove("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                    btn.classList.add("bg-surface-container", "text-on-surface-variant");
                }
            });
        }

        // Cambiar entre la vista de Administrador y Cliente en el artículo
        function switchRoleView(role) {
            const btnAdmin = document.getElementById("tab-btn-admin");
            const btnCliente = document.getElementById("tab-btn-cliente");
            const quickAdmin = document.getElementById("quick-bar-admin");
            const quickCliente = document.getElementById("quick-bar-cliente");
            const cardsAdmin = document.getElementById("cards-container-admin");
            const cardsCliente = document.getElementById("cards-container-cliente");

            if (role === "admin") {
                if (btnAdmin) {
                    btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                }
                if (btnCliente) {
                    btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                }
                if (quickAdmin) quickAdmin.classList.remove("hidden");
                if (quickCliente) quickCliente.classList.add("hidden");
                if (cardsAdmin) cardsAdmin.classList.remove("hidden");
                if (cardsCliente) cardsCliente.classList.add("hidden");
                switchPrototypeScreen("screen-productos");
            } else {
                if (btnCliente) {
                    btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                }
                if (btnAdmin) {
                    btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                }
                if (quickAdmin) quickAdmin.classList.add("hidden");
                if (quickCliente) quickCliente.classList.remove("hidden");
                if (cardsAdmin) cardsAdmin.classList.add("hidden");
                if (cardsCliente) cardsCliente.classList.remove("hidden");
                switchPrototypeScreen("screen-cliente-catalogo");
            }
        }

        function resetPrototype() {
            const iframe = document.getElementById("prototype-iframe");
            if (iframe) {
                iframe.src = iframe.src;
                switchRoleView('admin');
            }
        }

        // Sincronizar botones cuando el usuario navega dentro del prototipo
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'SCREEN_CHANGED') {
                const screenId = e.data.screenId;

                // Actualizar pestaña de rol activa según la pantalla
                if (screenId.startsWith('screen-cliente')) {
                    const btnAdmin = document.getElementById("tab-btn-admin");
                    const btnCliente = document.getElementById("tab-btn-cliente");
                    const quickAdmin = document.getElementById("quick-bar-admin");
                    const quickCliente = document.getElementById("quick-bar-cliente");
                    const cardsAdmin = document.getElementById("cards-container-admin");
                    const cardsCliente = document.getElementById("cards-container-cliente");

                    if (btnCliente) btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                    if (btnAdmin) btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                    if (quickAdmin) quickAdmin.classList.add("hidden");
                    if (quickCliente) quickCliente.classList.remove("hidden");
                    if (cardsAdmin) cardsAdmin.classList.add("hidden");
                    if (cardsCliente) cardsCliente.classList.remove("hidden");
                } else {
                    const btnAdmin = document.getElementById("tab-btn-admin");
                    const btnCliente = document.getElementById("tab-btn-cliente");
                    const quickAdmin = document.getElementById("quick-bar-admin");
                    const quickCliente = document.getElementById("quick-bar-cliente");
                    const cardsAdmin = document.getElementById("cards-container-admin");
                    const cardsCliente = document.getElementById("cards-container-cliente");

                    if (btnAdmin) btnAdmin.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-sm";
                    if (btnCliente) btnCliente.className = "px-5 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-on-surface-variant hover:text-primary";
                    if (quickAdmin) quickAdmin.classList.remove("hidden");
                    if (quickCliente) quickCliente.classList.add("hidden");
                    if (cardsAdmin) cardsAdmin.classList.remove("hidden");
                    if (cardsCliente) cardsCliente.classList.add("hidden");
                }

                document.querySelectorAll(".proto-tab-btn").forEach(btn => {
                    if (btn.dataset.screen === screenId) {
                        btn.classList.add("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                        btn.classList.remove("bg-surface-container", "text-on-surface-variant");
                    } else {
                        btn.classList.remove("bg-primary-container", "text-on-primary-fixed", "border-surface-tint");
                        btn.classList.add("bg-surface-container", "text-on-surface-variant");
                    }
                });
            }
        });
    </script>
